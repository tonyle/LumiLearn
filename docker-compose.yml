services:
  db:
    image: postgres:16-bookworm
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumilearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lumilearn}
    volumes: ["lumilearn_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      IPAD_APP_URL: ${IPAD_APP_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumilearn}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lumilearn}
    ports: ["3000:3000"]
    volumes: ["lumilearn_uploads:/app/data/uploads"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
volumes:
  lumilearn_db:
  lumilearn_uploads:
