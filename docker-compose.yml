services:
  db:
    image: postgres:16-bookworm
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumilearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lumilearn}
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DOCUMENT_CONVERTER_URL: http://documents:8080
      READING_SERVICE_URL: http://reading:8080
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-}
      BOOK_CA_PATH: /app/data/certificates/lumilearn-root.crt
      IPAD_APP_URL: ${IPAD_APP_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumilearn}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lumilearn}
    networks: [default, documents, reading]
    ports: ["3000:3000"]
    volumes:
      - type: bind
        source: ./data/uploads
        target: /app/data/uploads
        bind:
          create_host_path: false
      - ./data/certificates:/app/data/certificates:ro
    depends_on:
      db: { condition: service_healthy }
      documents: { condition: service_started }
      reading: { condition: service_started }
    restart: unless-stopped
  documents:
    build: ./docker/documents
    networks: [documents]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
  reading:
    build: ./docker/reading
    networks: [reading]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=64m,mode=1777"]
    volumes: ["./data/reading-models:/models"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
  reading-model-setup:
    build: ./docker/reading
    profiles: [model-setup]
    command: ["python", "models.py"]
    volumes: ["./data/reading-models:/models"]
    mem_limit: 2g
    cpus: 2
  caddy:
    build: ./docker/caddy
    environment:
      LUMI_LAN_HOST: ${LUMI_LAN_HOST:-127.0.0.1}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-}
    ports: ["3443:3443"]
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      # Fetch an actual TLS response and validate it with this instance's CA.
      test: ["CMD-SHELL", "wget -q -O /dev/null --ca-certificate=/data/caddy/pki/authorities/local/root.crt https://localhost:3443/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on: [app]
    restart: unless-stopped

networks:
  default:
  documents:
    internal: true
  reading:
    internal: true

volumes:
  lumilearn_db:
  lumilearn_uploads:
