services:
  db:
    image: postgres:16-bookworm
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumilearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lumilearn}
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    image: ${COMPOSE_PROJECT_NAME:-easylearn}-app
    build: .
    env_file: .env
    environment: &app-environment
      DOCUMENT_CONVERTER_URL: http://documents:8080
      READING_SERVICE_URL: http://reading:8080
      TTS_SERVICE_URL: http://tts:8080
      TTS_TIMEOUT_MS: ${TTS_TIMEOUT_MS:-95000}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-}
      BOOK_CA_PATH: /app/data/certificates/lumilearn-root.crt
      IPAD_APP_URL: ${IPAD_APP_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumilearn}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lumilearn}
    networks: [default, documents, reading, tts]
    ports: ["3000:3000"]
    volumes: &app-storage
      - type: bind
        source: ./data/uploads
        target: /app/data/uploads
        bind:
          create_host_path: false
      - ./data/certificates:/app/data/certificates:ro
    depends_on:
      db: { condition: service_healthy }
      documents: { condition: service_started }
      reading: { condition: service_healthy }
      tts: { condition: service_healthy }
    restart: unless-stopped
  book-audio:
    image: ${COMPOSE_PROJECT_NAME:-easylearn}-app
    env_file: .env
    environment: *app-environment
    command: ["node", "--import", "tsx", "scripts/book-audio-worker.ts"]
    networks: [default, tts]
    volumes: *app-storage
    depends_on:
      db: { condition: service_healthy }
      tts: { condition: service_healthy }
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 105s
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/app/data/uploads/books/audio/.worker.json');if(Date.now()-s.mtimeMs>180000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  documents:
    build: ./docker/documents
    networks: [documents]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
  reading:
    build: ./docker/reading
    depends_on:
      reading-model-setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3))['status']=='ready'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [reading]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=64m,mode=1777"]
    volumes: ["./data/reading-models:/models"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
  reading-model-setup:
    build: ./docker/reading
    command: ["python", "models.py"]
    volumes: ["./data/reading-models:/models"]
    mem_limit: 2g
    cpus: 2
  tts:
    build: ./docker/tts
    environment:
      TTS_THREADS: ${TTS_THREADS:-2}
      TTS_CACHE_MAX_MB: ${TTS_CACHE_MAX_MB:-512}
      TTS_SYNTHESIS_TIMEOUT_SECONDS: 90
    networks: [tts]
    read_only: true
    # phonemizer loads a temporary copy of its eSpeak shared library.
    tmpfs: ["/tmp:rw,nosuid,exec,size=128m,mode=1777"]
    volumes: ["./data/tts-audio:/cache"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)); assert h['status']=='ready' and h['voice']=='af_heart'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
  caddy:
    build: ./docker/caddy
    environment:
      LUMI_LAN_HOST: ${LUMI_LAN_HOST:-127.0.0.1}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-}
    ports: ["3443:3443"]
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      # Fetch an actual TLS response and validate it with this instance's CA.
      test: ["CMD-SHELL", "wget -q -O /dev/null --ca-certificate=/data/caddy/pki/authorities/local/root.crt https://localhost:3443/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on: [app]
    restart: unless-stopped

networks:
  tts:
    internal: true
  default:
  documents:
    internal: true
  reading:
    internal: true

volumes:
  lumilearn_db:
  lumilearn_uploads:
